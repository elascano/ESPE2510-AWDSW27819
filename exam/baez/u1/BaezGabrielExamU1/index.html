<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Baez Gabriel - ExamU1</title>
</head>
<body>
    <section>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Employee Data</h5>
                <form id="createEmployee">
                    <div class="mb-3">
                    <label for="nameEmployee">Enter your Name</label>
                    <input type="text" name="nameEmployee" id="nameEmployee" class="form-control" placeholder="e.g Gabriel">
                    </div>
                    <div class="mb-3">
                        <label for="lastanameEmployee">Enter your Lastname</label>
                        <input type="text" name="lastanameEmployee" id="lastanameEmployee" class="form-control" placeholder="e.g Baez">
                    </div>
                    <div class="mb-3">
                        <label for="ageEmployee">Enter your Age</label>
                        <input type="number" name="ageEmployee" id="ageEmployee" class="form-control" placeholder="Enter values between 18 and 60" min="18" max="60">
                    </div>
                    <div class="mb-3">
                        <label for="ocupationEmployee">Enter your Ocupation</label>
                        <input type="text" name="ocupationEmployee" id="ocupationEmployee" class="form-control" placeholder="e.g Secretary">
                    </div>
                    <div class="mb-3">
                        <label for="bossName">Enter your Boss Name</label>
                        <input type="text" name="bossName" id="bossName" class="form-control" placeholder="e.g Edison Lascano">
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                            <i class="bi bi-check-circle"></i> Send Data Employee
                    </button>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
