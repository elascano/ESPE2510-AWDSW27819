<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Search (Open Library API)</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="main-card">
        <h1>Book Finder</h1>

        <div class="search-bar">
            <input type="text" id="bookInput" placeholder="Enter title or author (e.g., Lord of the Rings)">
            <button id="searchButton">Search Book</button>
        </div>

        <div id="bookResults" class="results-container">
            <p>Enter a search term to find books.</p>
        </div>
    </div>

    <script src="./js/script.js"></script>
</body>

</html>
