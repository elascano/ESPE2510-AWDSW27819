<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Framer</title>
</head>
<body>

    <h1>Register Chicken</h1>

    <form action="php/registerChicken.php" method="POST">

        <label for="nombre">Chicken Name:</label><br>
        <input type="text" id="nombre" name="nombre" ><br><br>

        <label for="color">Color (Ej: white, red):</label><br>
        <input type="text" id="color" name="color"><br><br>

        <label for="edad">Age (in days):</label><br>
        <input type="number" id="edad" name="edad" min="1"><br><br>

        <label for="muda">Is molting?</label><br>
        <input type="checkbox" id="muda" name="muda" value="1"><br><br>

        <label for="coop_id">Assign to Coop:</label><br>
        <select id="coop_id" name="coop_id" >
            <option value="">Select a Coop</option>
            <option value="1">Coop A (ID: 1)</option>
            <option value="2">Coop B (ID: 2)</option>
            <option value="3">Coop C (ID: 3)</option>
            </select><br><br>

        <button type="submit"><a src="chickenFramer.html"></a>Register Chicken</button>

    </form>

</body>
</html>
